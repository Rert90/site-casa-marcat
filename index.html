<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Căutare Produse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Lock Screen (dezactivat)
    <div id="lockScreen">
        <div class="lock-box">
            <div class="lock-icon">🔒</div>
            <div class="lock-title">Acces Protejat</div>
            <input type="password" id="pinInput" placeholder="PIN" maxlength="10" autocomplete="off">
            <button id="pinSubmit">Intră</button>
            <div id="pinError"></div>
        </div>
    </div>
    -->

    <div class="app-container">
        <div class="header-section">
            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Caută produse..." autofocus>
            </div>
            <div id="status">Se încarcă...</div>
        </div>

        <div class="table-container">
            <table id="productTable">
                <thead>
                    <tr>
                        <th style="width: 20%;">Nr.</th>
                        <th>Denumire Produs</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    </tbody>
            </table>
        </div>
        
        <div id="noResults" class="hidden">Nu am găsit rezultate.</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
