<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Căutare Produse</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #ffffff; margin: 0; padding: 20px; }
        .header-section { display: flex; flex-direction: column; align-items: center; position: sticky; top: 0; background: white; padding: 20px 0; z-index: 1000; border-bottom: 2px solid #f0f0f0; }
        .search-wrapper { position: relative; width: 90%; max-width: 600px; }
        .search-icon { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); font-size: 24px; }
        #searchInput { width: 100%; padding: 18px 20px 18px 60px; font-size: 22px; border: 3px solid #333; border-radius: 50px; outline: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        #status { margin-top: 15px; color: #888; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background-color: #f8f9fa; color: #333; padding: 15px; text-align: left; border-bottom: 2px solid #333; }
        td { padding: 18px 15px; border-bottom: 1px solid #eee; font-size: 18px; color: #222; }
        tr:nth-child(even) { background-color: #fafafa; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="header-section">
        <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Caută produse..." autofocus>
        </div>
        <div id="status">Se încarcă...</div>
    </div>

    <table>
        <thead>
            <tr><th style="width: 20%;">Nr.</th><th>Denumire Produs</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        // AICI LIPESTI DATELE TALE DIN EXCEL
        const csvData = `
1099;AC2XABY 5X16 -UNIFILAR
629;ACUM LI/ION 18650
297;ACUM. 12V CU GEL 100AH
LIPEȘTE_RESTUL_LINIILOR_AICI
        `;

        const tableBody = document.getElementById('tableBody');
        const searchInput = document.getElementById('searchInput');
        const status = document.getElementById('status');

        function init() {
            const lines = csvData.trim().split('\n');
            const rows = lines.map(line => {
                const parts = line.split(';');
                return { id: parts[0] || '', name: parts[1] || '' };
            });

            tableBody.innerHTML = rows.map(item => `<tr><td><strong>${item.id}</strong></td><td>${item.name}</td></tr>`).join('');
            status.textContent = `Total produse: ${rows.length}`;

            searchInput.addEventListener('input', (e) => {
                const queryWords = e.target.value.toLowerCase().trim().split(/\s+/);
                const tableRows = tableBody.getElementsByTagName('tr');
                let count = 0;

                for (let i = 0; i < tableRows.length; i++) {
                    const text = tableRows[i].textContent.toLowerCase();
                    const match = queryWords.every(word => text.includes(word));
                    tableRows[i].style.display = match ? "" : "none";
                    if(match) count++;
                }
                status.textContent = `Găsite: ${count}`;
            });
        }
        init();
    </script>
</body>
</html>
